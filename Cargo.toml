[package]
name = "rust_4motor_drv"
version = "0.1.0"
edition = "2021"
description = "4motor driver"
repository = "https://github.com/ivrabie/r4motor_drv.git"

[dependencies]
linux-embedded-hal = { version = "0.4", features = ["gpio_cdev"] }
embedded-hal = { version = "1.0.0" }
crc = { version = "3", default-features = false }
clap = { version = "4.5.53", features = ["derive"] }
num_enum = "0.7"
log = "0.4"
env_logger = "0.11"
